# Androidアプリを組み立てて、できあがったAPKを成果物として置く。
# Codemagic にログインしなくても、GitHub 上だけでビルドの成否を確認できる。
# 成功すると Actions の実行画面の「Artifacts」から inuneko-debug-apk をダウンロードできる。
name: Android デバッグAPK

on:
  push:
    branches: ["claude/**", "main"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # APK を Release に載せるために書き込み権限が要る
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 は JDK 21（android/app/capacitor.build.gradle が VERSION_21 を要求）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # compileSdk 36 を用意。ランナーには Android SDK が同梱済みなので必要な分だけ追加する
      # （android-actions/setup-android@v3 は廃止済みの 'tools' を探して失敗するため使わない）
      - name: Android SDK (API 36)
        run: |
          set -eux
          SDKMGR=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: 依存インストール
        run: npm ci

      - name: エンジン単体テスト
        run: npm test

      - name: Androidリソース参照の検証
        run: python3 tools/check_android_res.py

      - name: Capacitor 同期
        run: npx cap sync android

      - name: APK ビルド
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: inuneko-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # スマホから「タップするだけ」で入れられるように、APKを固定URLのReleaseに置く。
      # zipに包まれず、GitHubへのログインも不要。テスターへの配布もこのリンクでできる。
      # 固定URL: https://github.com/kamomet999/dog_cat/releases/download/test-latest/inuneko-test.apk
      - name: APK を Release に公開（test-latest を上書き）
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          cp "$(ls android/app/build/outputs/apk/debug/*.apk | head -1)" inuneko-test.apk
          gh release view test-latest >/dev/null 2>&1 || gh release create test-latest \
            --title "テスト用ビルド（最新）" \
            --prerelease \
            --notes "実機テスト用のAndroidアプリです。ストア公開前の動作確認用。

          ## 入れかた（Androidスマホ）
          1. 下の **inuneko-test.apk** をタップしてダウンロード
          2. ダウンロード通知をタップ
          3. 「この提供元のアプリのインストールを許可」と出たら許可
          4. インストール → ホーム画面に「いぬねこ図鑑」が追加されます

          ※ 「不明なアプリ」の警告が出ることがありますが、開発中のアプリのためです。
          ※ iPhone には入りません（Android専用）。
          ※ このAPKはビルドのたびに最新へ置き換わります。"
          gh release upload test-latest inuneko-test.apk --clobber
